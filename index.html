<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détection d'objets et caméra</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- TensorFlow.js et modèle COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #06b6d4;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .logo i {
      color: var(--primary);
      font-size: 1.5rem;
    }

    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.5rem;
      flex: 1;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .main-viewport {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .video-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 480px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      display: none;
    }

    canvas {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .overlay-status {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 10;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-red);
    }

    .status-dot.active {
      background-color: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
    }

    .camera-prompt {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
      padding: 2rem;
      z-index: 5;
    }

    .btn-start-cam {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-start-cam:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .controls-bar {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      min-width: 250px;
    }

    .select-group label {
      font-size: 0.9rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    select {
      width: 100%;
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-icon {
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-icon:hover {
      background: var(--border-color);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 1.25rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-main);
    }

    .legend-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      background: var(--bg-color);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .legend-tag {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .color-badge {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .slider-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .detection-log {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .log-item {
      font-size: 0.8rem;
      padding: 0.5rem;
      background: var(--bg-color);
      border-left: 3px solid var(--primary);
      border-radius: 4px;
      color: var(--text-muted);
    }

    .log-time {
      font-size: 0.7rem;
      color: #64748b;
      margin-bottom: 2px;
    }

    #loader {
      position: absolute;
      background: rgba(15, 23, 42, 0.9);
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      z-index: 20;
      border-radius: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-color);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-camera-rotate"></i>
      <span>Vision Detection IA</span>
    </div>
    <div id="fps-display" style="font-size: 0.85rem; color: var(--text-muted);">
      FPS: 0
    </div>
  </header>

  <div class="container">
    <div class="main-viewport">
      <div class="video-card">
        <div id="loader">
          <div class="spinner"></div>
          <p id="loader-text">Chargement du modèle COCO-SSD...</p>
        </div>

        <div class="overlay-status">
          <div id="status-dot" class="status-dot"></div>
          <span id="status-text">Caméra Inactive</span>
        </div>

        <div id="camera-prompt" class="camera-prompt">
          <i class="fa-solid fa-video-slash" style="font-size: 3rem; color: var(--text-muted);"></i>
          <p>Autorisez l'accès pour utiliser la webcam ou le téléphone.</p>
          <button id="start-btn" class="btn-start-cam">
            <i class="fa-solid fa-video"></i> Activer la caméra
          </button>
        </div>

        <div class="canvas-wrapper">
          <video id="webcam" autoplay playsinline muted></video>
          <canvas id="output"></canvas>
        </div>
      </div>

      <div class="controls-bar">
        <div class="select-group">
          <label for="camera-select"><i class="fa-solid fa-camera"></i> Caméra :</label>
          <select id="camera-select" disabled>
            <option value="">Cliquez sur "Activer la caméra"</option>
          </select>
          <button id="refresh-cams" class="btn-icon" title="Rafraîchir les caméras">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="card">
        <div class="card-title">
          <i class="fa-solid fa-sliders"></i> Paramètres
        </div>
        <div class="slider-group">
          <label>Seuil de confiance : <span id="conf-val">50%</span></label>
          <input type="range" id="conf-slider" min="0.2" max="0.9" step="0.05" value="0.5">
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fa-solid fa-list-check"></i> Objets recherchés
        </div>
        <div class="legend-list">
          <div class="legend-item">
            <div class="legend-tag">
              <div class="color-badge" style="background: #00FF00;"></div>
              <span>Humain</span>
            </div>
            <span style="font-size:0.75rem; color: var(--text-muted);">Vert</span>
          </div>
          <div class="legend-item">
            <div class="legend-tag">
              <div class="color-badge" style="background: #FF0000;"></div>
              <span>Téléphone</span>
            </div>
            <span style="font-size:0.75rem; color: var(--text-muted);">Rouge</span>
          </div>
          <div class="legend-item">
            <div class="legend-tag">
              <div class="color-badge" style="background: #0000FF;"></div>
              <span>Cravate / Lunettes</span>
            </div>
            <span style="font-size:0.75rem; color: var(--text-muted);">Bleu</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fa-solid fa-volume-high"></i> Synthèse Vocale
        </div>
        <div class="legend-item">
          <span>Vocale active (2s)</span>
          <i class="fa-solid fa-check" style="color: var(--accent-green);"></i>
        </div>
      </div>

      <div class="card" style="flex: 1;">
        <div class="card-title">
          <i class="fa-solid fa-clock-rotate-left"></i> Historique
        </div>
        <div id="detection-log" class="detection-log">
          <div class="log-item">En attente de détection...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let model = null;
    let video = document.getElementById('webcam');
    let canvas = document.getElementById('output');
    let ctx = canvas.getContext('2d');
    let currentStream = null;
    let isDetecting = false;
    let minConfidence = 0.5;

    let lastSoundTime = 0;
    const SOUND_COOLDOWN = 2000; // 2 secondes

    let frameCount = 0;
    let lastFpsCalc = Date.now();

    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    const cameraSelect = document.getElementById('camera-select');
    const startBtn = document.getElementById('start-btn');
    const refreshBtn = document.getElementById('refresh-cams');
    const cameraPrompt = document.getElementById('camera-prompt');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const confSlider = document.getElementById('conf-slider');
    const confVal = document.getElementById('conf-val');
    const detectionLog = document.getElementById('detection-log');
    const fpsDisplay = document.getElementById('fps-display');

    // Synthèse vocale
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Chargement du modèle COCO-SSD
    async function initModel() {
      try {
        model = await cocoSsd.load();
        loader.style.display = 'none';
      } catch (err) {
        loaderText.textContent = "Erreur de chargement du modèle IA.";
        console.error(err);
      }
    }

    // Énumérer les caméras
    async function getCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        
        cameraSelect.innerHTML = '';
        if (videoDevices.length === 0) {
          cameraSelect.innerHTML = '<option value="">Aucune caméra trouvée</option>';
          return;
        }

        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Caméra ${index + 1}`;
          cameraSelect.appendChild(option);
        });

        cameraSelect.disabled = false;
      } catch (err) {
        console.error("Erreur énumération :", err);
      }
    }

    // Démarrer le flux
    async function startCamera(deviceId = null) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId } } : true,
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;

        await new Promise((resolve) => {
          video.onloadedmetadata = () => resolve();
        });

        video.play();
        cameraPrompt.style.display = 'none';
        statusDot.classList.add('active');
        statusText.textContent = "Caméra Active";

        // Obtenir la liste mise à jour après l'autorisation accordée
        await getCameras();
        if (deviceId) cameraSelect.value = deviceId;

        if (!isDetecting) {
          isDetecting = true;
          detectFrame();
        }
      } catch (err) {
        console.error("Erreur caméra :", err);
        alert("Impossible d'accéder à la caméra sélectionnée.");
      }
    }

    // Boucle de détection
    async function detectFrame() {
      if (!isDetecting) return;

      // FPS
      frameCount++;
      const now = Date.now();
      if (now - lastFpsCalc >= 1000) {
        fpsDisplay.textContent = `FPS: ${frameCount}`;
        frameCount = 0;
        lastFpsCalc = now;
      }

      if (video.readyState === 4 && model) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const predictions = await model.detect(video);

        let humanDetected = false;
        let phoneDetected = false;
        let glassesDetected = false;

        predictions.forEach(pred => {
          if (pred.score >= minConfidence) {
            let label = "";
            let color = "";

            if (pred.class === 'person') {
              humanDetected = true;
              label = `Humain: ${(pred.score * 100).toFixed(0)}%`;
              color = '#00FF00';
            } else if (pred.class === 'cell phone') {
              phoneDetected = true;
              label = `Téléphone: ${(pred.score * 100).toFixed(0)}%`;
              color = '#FF0000';
            } else if (pred.class === 'tie') {
              glassesDetected = true;
              label = `Lunettes (Cravate): ${(pred.score * 100).toFixed(0)}%`;
              color = '#0000FF';
            }

            if (color !== "") {
              const [x, y, width, height] = pred.bbox;
              
              ctx.strokeStyle = color;
              ctx.lineWidth = 3;
              ctx.strokeRect(x, y, width, height);

              ctx.fillStyle = color;
              ctx.font = '16px Inter, sans-serif';
              const textWidth = ctx.measureText(label).width;
              ctx.fillRect(x, y > 25 ? y - 25 : y, textWidth + 10, 25);

              ctx.fillStyle = '#FFFFFF';
              ctx.fillText(label, x + 5, y > 25 ? y - 7 : y + 18);
            }
          }
        });

        // Synthèse Vocale
        if ((humanDetected || phoneDetected || glassesDetected) && (now - lastSoundTime > SOUND_COOLDOWN)) {
          let detections = [];
          if (humanDetected) detections.push("Humain");
          if (phoneDetected) detections.push("Téléphone");
          if (glassesDetected) detections.push("Lunettes");

          let phrase = detections.join(" et ") + " détecté" + (detections.length > 1 || glassesDetected ? "s" : "");
          speak(phrase);
          addLog(phrase);
          lastSoundTime = now;
        }
      }

      requestAnimationFrame(detectFrame);
    }

    function addLog(text) {
      const timeStr = new Date().toLocaleTimeString();
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerHTML = `<div class="log-time">${timeStr}</div>${text}`;
      detectionLog.insertBefore(item, detectionLog.firstChild);

      if (detectionLog.children.length > 10) {
        detectionLog.removeChild(detectionLog.lastChild);
      }
    }

    // Événements
    startBtn.addEventListener('click', () => startCamera());
    
    cameraSelect.addEventListener('change', (e) => {
      if (e.target.value) startCamera(e.target.value);
    });

    refreshBtn.addEventListener('click', () => getCameras());

    confSlider.addEventListener('input', (e) => {
      minConfidence = parseFloat(e.target.value);
      confVal.textContent = `${Math.round(minConfidence * 100)}%`;
    });

    // Initialisation du modèle au chargement
    initModel();
  </script>
</body>
</html>
